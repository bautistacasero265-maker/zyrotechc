name: Unpack ZyroTech source for review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-zip-for-review.yml"
      - "zyrotech-apps-actualizado.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract text sources and screen obvious secrets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import re
          import shutil

          archive = Path("zyrotech-apps-actualizado.zip")
          if not archive.exists():
              raise SystemExit("No se encontró el ZIP en la raíz del repositorio.")

          destination = Path("review-src")
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir()

          allowed = {".py", ".json", ".txt", ".bat", ".cmd", ".spec", ".yml",
                     ".yaml", ".toml", ".md", ".ini", ".reg", ".ps1",
                     ".html", ".css", ".js", ".xml", ".manifest"}
          blocked_parts = {".git", "__pycache__", ".venv", "venv", "node_modules"}
          blocked_suffixes = {".pem", ".key", ".p12", ".pfx", ".db", ".sqlite",
                              ".sqlite3", ".exe", ".dll", ".pyd", ".so"}
          secret_patterns = [
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(rb"gh[pousr]_[A-Za-z0-9_]{30,}"),
              re.compile(rb"xox[baprs]-[A-Za-z0-9-]{20,}"),
              re.compile(rb"AKIA[0-9A-Z]{16}"),
          ]

          count = 0
          total = 0
          suspicious = []
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      continue
                  if path.suffix.lower() in blocked_suffixes or path.name.lower().startswith(".env"):
                      if path.suffix.lower() in {".pem", ".key", ".p12", ".pfx"} or path.name.lower().startswith(".env"):
                          suspicious.append(f"Archivo sensible omitido: {name}")
                      continue
                  if any(part.lower() in blocked_parts for part in path.parts):
                      continue
                  if path.suffix.lower() not in allowed:
                      continue

                  data = zf.read(info)
                  if any(pattern.search(data) for pattern in secret_patterns):
                      suspicious.append(f"Posible secreto dentro del archivo (omitido): {name}")
                      continue
                  try:
                      data.decode("utf-8")
                  except UnicodeDecodeError:
                      continue

                  target = destination.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  count += 1
                  total += len(data)

          report = [
              f"Archivos de texto extraídos: {count}",
              f"Bytes de código extraídos: {total}",
              "",
              "Revisión automática limitada: busca nombres de archivos de claves y algunos patrones de tokens conocidos.",
              "No garantiza que no existan secretos codificados o contraseñas dentro del código.",
              "",
              * (suspicious or ["No se detectaron archivos sensibles por las reglas básicas."])
          ]
          (destination / "SECURITY_SCAN.txt").write_text("\n".join(report), encoding="utf-8")
          print("\n".join(report))
          if count == 0:
              raise SystemExit("No se encontraron archivos de código compatibles.")
          PY

      - name: Publish review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B zyrotech-source-review
          git add review-src
          git commit -m "chore: unpack ZyroTech sources for code review"
          git push --force origin zyrotech-source-review
