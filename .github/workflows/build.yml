name: Build ZyroTech Free

on:
  push:
    branches:
      - main
      - zyrotech-separate-editions
    paths:
      - "app/**"
      - "tools/build.py"
      - "tests/**"
      - "build.bat"
      - "requirements-build.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-free:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Validate Python syntax
        run: python -m compileall -q app tools tests

      - name: Run Free edition tests
        run: python -m unittest discover -s tests -v

      - name: Build ZyroTech Free
        run: python tools/build.py

      - name: Upload ZyroTech Free
        uses: actions/upload-artifact@v4
        with:
          name: ZyroTech-Free-Windows-x64
          path: dist/ZyroTech-Free.exe
          if-no-files-found: error
          retention-days: 14
