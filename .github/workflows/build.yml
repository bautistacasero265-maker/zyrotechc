name: Build ZyroTech

on:
  push:
    branches:
      - main
      - zyrotech-profiles-auto-detection
    paths:
      - "app/**"
      - "tools/**"
      - "tweaks.json"
      - "build.bat"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller customtkinter cryptography

      - name: Validate and regenerate tweak catalog
        run: python tools/generate_tweaks.py

      - name: Test profile rules and Free packaging
        run: python -m unittest discover -s tests -v

      - name: Build Free edition
        run: python tools/build.py free

      - name: Check whether Pro signing key is configured
        id: pro-key
        shell: pwsh
        run: |
          $value = python -c "import runpy; print(runpy.run_path('app/public_key.py').get('PUBLIC_KEY_B32', ''))"
          if ([string]::IsNullOrWhiteSpace($value)) {
            "configured=false" >> $env:GITHUB_OUTPUT
            Write-Host "Pro no se compila: app/public_key.py no contiene la clave pública del vendedor."
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build Pro edition
        if: steps.pro-key.outputs.configured == 'true'
        run: python tools/build.py pro

      - name: Explain Pro build skip
        if: steps.pro-key.outputs.configured != 'true'
        shell: pwsh
        run: |
          Write-Host "Se publicó el artefacto Free. Para compilar Pro, el propietario debe cargar únicamente su clave PÚBLICA en app/public_key.py."
          Write-Host "Nunca subir tools/zyrotech_private.pem."

      - name: Upload executable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZyroTech-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
